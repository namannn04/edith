name: Release on merge

on:
  push:
    branches: [main]
    paths:
      - "apps/macos/**"
      - ".github/workflows/release-on-merge.yml"
  workflow_dispatch:

concurrency:
  group: release-on-merge
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'Bump version to ')"
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/macos
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require signing certificate
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "release blocked: MACOS_CERT_P12 is required" >&2
          exit 1

      - name: Require Sparkle signing key
        if: env.HAS_SPARKLE_KEY != 'true'
        run: |
          echo "release blocked: SPARKLE_PRIVATE_KEY is required." >&2
          echo "Without it this job cannot sign the appcast, and publishing a release" >&2
          echo "whose appcast.xml is missing or unsigned breaks in-app updates for" >&2
          echo "everyone, because Sparkle resolves the feed from the latest release." >&2
          echo "Export it once with:  generate_keys -x sparkle-private.key" >&2
          echo "then:  gh secret set SPARKLE_PRIVATE_KEY < sparkle-private.key" >&2
          exit 1

      - name: Work out the next patch version
        id: version
        run: |
          CURRENT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          case "$CURRENT" in
            *.*.*) ;;
            *) echo "release blocked: version $CURRENT is not major.minor.patch" >&2; exit 1 ;;
          esac
          MAJOR="${CURRENT%%.*}"
          REST="${CURRENT#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          case "$MAJOR$MINOR$PATCH" in
            *[!0-9]*) echo "release blocked: version $CURRENT is not numeric" >&2; exit 1 ;;
          esac
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          if git rev-parse "v$NEXT" >/dev/null 2>&1; then
            echo "release blocked: tag v$NEXT already exists" >&2
            exit 1
          fi
          BUILD=$(( $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist) + 1 ))
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Releasing $CURRENT -> $NEXT (build $BUILD)"

      - name: Bump the bundled version
        run: |
          for plist in Resources/Info.plist Resources/HelperInfo.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.next }}" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.build }}" "$plist"
          done

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/edith-signing.keychain-db"
          security create-keychain -p "$MACOS_CERT_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_CERT_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERT_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build the app
        env:
          EDITH_RELEASE_ALLOW_DEV_SIGNING: "1"
        run: ./build.sh --no-open --release

      - name: Package the DMG
        run: |
          rm -rf dmg-root && mkdir dmg-root
          cp -R dist/Edith.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname Edith -srcfolder dmg-root -format UDZO Edith.dmg
          rm -rf dmg-root

      - name: Generate the signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          GENERATE_APPCAST=".build/artifacts/sparkle/Sparkle/bin/generate_appcast"
          test -x "$GENERATE_APPCAST" \
            || { echo "release blocked: generate_appcast missing from the Sparkle artifact" >&2; exit 1; }
          rm -rf dist/appcast && mkdir dist/appcast
          cp Edith.dmg dist/appcast/
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${NEXT}/" \
            dist/appcast
          test -f dist/appcast/appcast.xml \
            || mv dist/appcast/appcast dist/appcast/appcast.xml
          grep -q "url=\"https://github.com/${GITHUB_REPOSITORY}/releases/download/v${NEXT}/Edith.dmg\"" \
            dist/appcast/appcast.xml \
            || { echo "release blocked: appcast enclosure does not point at the v${NEXT} asset" >&2; exit 1; }
          grep -q 'sparkle:edSignature=' dist/appcast/appcast.xml \
            || { echo "release blocked: appcast is not signed" >&2; exit 1; }

      - name: Verify signatures
        run: codesign --verify --deep --strict dist/Edith.app

      - name: Commit and tag the bump
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Resources/Info.plist Resources/HelperInfo.plist
          git commit -m "Bump version to ${NEXT}"
          git tag "v${NEXT}"
          git push origin HEAD:main
          git push origin "v${NEXT}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          gh release create "v${NEXT}" --title "Edith v${NEXT}" --generate-notes \
            Edith.dmg dist/appcast/appcast.xml
