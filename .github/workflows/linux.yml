name: Linux

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  ubuntu:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump version to ')
    runs-on: ubuntu-24.04
    container: swift:6.3.2-noble
    steps:
      - uses: actions/checkout@v5
      - name: Install native dependencies
        run: apt-get update && apt-get install -y libgtk-4-dev desktop-file-utils appstream dpkg-dev make
      - name: Test portable core
        run: make linux-test
      - name: Validate desktop metadata
        run: make linux-metadata
      - name: Build Debian package
        run: make linux-package
      - name: Verify Debian package
        run: |
          dpkg-deb --info dist/linux/*.deb
          dpkg-deb --contents dist/linux/*.deb
          apt-get install -y ./dist/linux/*.deb
          edith-linux --diagnose
      - uses: actions/upload-artifact@v4
        with:
          name: edith-ubuntu-amd64
          path: dist/linux/*.deb
          if-no-files-found: error
